<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>文档屏</title>
<style>
  html, body { margin: 0; background: #111; }
  img { display: block; width: 390px; height: auto; }
</style>
</head>
<body>
<img id="shot" alt="">
<script>
const q = new URLSearchParams(location.search)
const name = q.get('name') || ''
const shot = document.getElementById('shot')
shot.src = 'screen.png?name=' + encodeURIComponent(name)
let nodes = []
fetch('nodes.json?name=' + encodeURIComponent(name)).then((r) => r.json()).then((data) => { nodes = data.nodes || [] })
shot.addEventListener('click', (event) => {
  const rect = shot.getBoundingClientRect()
  const x = (event.clientX - rect.left) * (390 / rect.width)
  const y = (event.clientY - rect.top) * (shot.naturalHeight / shot.naturalWidth) * (390 / rect.width)
  const hit = nodes.filter((n) => x >= n.x && y >= n.y && x <= n.x + n.w && y <= n.y + n.h).sort((a, b) => a.w * a.h - b.w * b.h)[0]
  if (!hit) return
  parent.postMessage({ dshDesign: 1, nodeId: hit.id, name: hit.name, type: hit.type }, '*')
})
</script>
</body>
</html>
